# 500M / 100B row of the "hyper parameter transfer" sheet, tab "Muon fixed batchsize".
# Final values only, copied from the sheet (letters = sheet columns). muonium applies its own
# sqrt(max(1, out/in)) to the Muon lr on top; the sheet values already account for that.

muon:  {momentum: 0.95, wd: 0.027386127875258306}  # K, J
adamw: {one_minus_betas: [0.03, 0.0003], wd: 0.05477225575051661}  # R, S (1-beta, pasted as-is), U (norms)

# first regex match wins, top to bottom; every parameter must match exactly one group
groups:
  attn_qo:     {match: 'self_attn\.(q|o)_proj', algorithm: muon, lr: 0.001011299793694863}  # F
  attn_kv:     {match: 'self_attn\.(k|v)_proj', algorithm: muon, lr: 0.001011299793694863}  # G
  mlp_up:      {match: 'mlp\.(gate|up)_proj', algorithm: muon, lr: 0.001011299793694863}  # H
  mlp_down:    {match: 'mlp\.down_proj', algorithm: muon, lr: 0.0011597225588258443}  # I
  # embed_tokens is tied with lm_head: unembedding columns M, Q, T cover both.
  embed:       {match: 'embed_tokens', algorithm: adamw, lr: 0.0003286335345030996, eps: 1.825741858350554e-8, wd: 0.10954451150103323}  # M, Q, T
  final_norm:  {match: '^model\.norm\.', algorithm: adamw, lr: 0.0006572670690061992, eps: 1.825741858350554e-8}  # L, Q
  hidden_norm: {match: 'layernorm', algorithm: adamw, lr: 0.00048542390097353424, eps: 6.741998624632422e-9}  # N, P
