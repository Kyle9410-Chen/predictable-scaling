# 1B / 200B row of the "hyper parameter transfer" sheet, tab "Muon fixed batchsize".
# Final values only, copied from the sheet (letters = sheet columns). muonium applies its own
# sqrt(max(1, out/in)) to the Muon lr on top; the sheet values already account for that.

muon:  {momentum: 0.95, wd: 0.016598500055174645}  # K, J
adamw: {one_minus_betas: [0.015, 0.00015], wd: 0.03872983346207417}  # R, S (1-beta, pasted as-is), U (norms)

# first regex match wins, top to bottom; every parameter must match exactly one group
groups:
  attn_qo:     {match: 'self_attn\.(q|o)_proj', algorithm: muon, lr: 0.0006123724356957946}  # F
  attn_kv:     {match: 'self_attn\.(k|v)_proj', algorithm: muon, lr: 0.0006123724356957946}  # G
  mlp_up:      {match: 'mlp\.(gate|up)_proj', algorithm: muon, lr: 0.0006123724356957946}  # H
  mlp_down:    {match: 'mlp\.down_proj', algorithm: muon, lr: 0.0005796550698475776}  # I
  # embed_tokens is tied with lm_head: unembedding columns M, Q, T cover both.
  embed:       {match: 'embed_tokens', algorithm: adamw, lr: 0.00019918200066209568, eps: 2.5819888974716113e-8, wd: 0.09036961141150641}  # M, Q, T
  final_norm:  {match: '^model\.norm\.', algorithm: adamw, lr: 0.00046475800154489, eps: 2.5819888974716113e-8}  # L, Q
  hidden_norm: {match: 'layernorm', algorithm: adamw, lr: 0.0002939387691339814, eps: 6.9985421222376506e-9}  # N, P
